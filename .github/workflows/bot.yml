
name: Keep Bot Alive

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: vortexdomain-telegram-bot
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pytz psycopg2-binary matplotlib numpy pandas pyTelegramBotAPI Flask gTTS

      - name: Run Vortexdomain bot
        env:
          TOKEN: ${{ secrets.TOKEN }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TWELVEDATA_KEYS: ${{ secrets.TWELVEDATA_KEYS }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: python -u bot.py
        
