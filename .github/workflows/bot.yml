name: Vortexdomain Bot

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pytz pyTelegramBotAPI matplotlib numpy pandas Flask gTTS

      - name: Run Vortexdomain
        env:
          TOKEN: ${{ secrets.TOKEN }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
          TWELVEDATA_KEYS: ${{ secrets.TWELVEDATA_KEYS }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: python -u bot.py
